# deploy/strata-container.conf - every knob the Strata container takes, and what it is set to now.
#
# Read by deploy/strata-start.sh (POSIX sh: KEY=value, "#" comments).  An ACTIVE line is applied by
# the start script.  A COMMENTED line is a knob that exists but is not set: the comment says what the
# container gets instead - docker's or the image's own default, or the value setup.py resolved on
# this install and recorded in the install config on the /data volume.
#
# FOUR LAYERS, and which of them this file reaches:
#
#   1  docker run       the container's identity, its devices and its port          -> active below
#   2  container env    read by docker-entrypoint.sh on the container's FIRST start, or on any start
#                       with REINSTALL=1.  After that the choices live in the install config on
#                       /data, so changing one of these needs REINSTALL=1          -> active where set
#   3  engine flags     170 of them, read from the install config's "args".  ENGINE_ARGS below is
#                       reconciled into that config by strata-start.sh on every start; the flags
#                       setup.py writes itself are listed separately, because they are install-derived
#   4  serve/server.py  not reachable from here: setup.py starts it with --engine/--config/--port
#
# Every engine flag with its full description:
#     docker exec strata /opt/strata/engine-cuda12/strata --help

# ==================================================================================================
# 1. the container
# ==================================================================================================

NAME=strata                     # the docker container name
IMAGE=strata:v102               # built from this repo's Dockerfile: CUDA 12 + sm_70 for the two V100s
NETWORK=strata-net              # REQUIRED.  The egress allowlist in deploy/strata-netfilter.sh is
                                # scoped to this network's bridge; recreating the network invalidates
                                # it, and strata-start.sh re-applies it when it has to create one.
PUBLISH="127.0.0.1:8081:8080"
                                # the API is on host port 8081.  Space separated, so a bind can be added
                                # without touching the script: add "<your-LAN-IP>:8081:8080" (in
                                # deploy/strata-container.local.conf, which is gitignored) to reach it
                                # from other machines.  Loopback keeps local access working.
                                #
                                # What actually gates that address: at the packet level, nothing.
                                # Docker publishes a port by DNAT-ing it in PREROUTING and accepting the
                                # flow in its own FORWARD rules (DOCKER-FORWARD -> DOCKER-BRIDGE ->
                                # DOCKER), and those are consulted BEFORE ufw's chains - so a ufw rule
                                # for a published port is advisory.  The real boundary is who can route to
                                # the published LAN address (the LAN, unless the router forwards the port) plus
                                # the API key.  There is no TLS, so the key is a plain bearer token on
                                # that segment.
                                #
                                # ufw rules for 8081 exist for the same seven trusted LAN ranges as the
                                # host's other services.  They do gate traffic that reaches the INPUT
                                # chain - a client on this host - and they keep the config consistent,
                                # but they are not what keeps other machines out.
VOLUME=strata-data:/data        # the model, the pack, the MTP layer and the install config
ULIMIT_MEMLOCK=-1               # the engine page-locks 28.21 GiB of experts
DOCKER_GPUS=all                 # the devices docker exposes; GPUS below picks which the engine uses
# RESTART=unless-stopped        # not set -> the container does NOT come back after a reboot

# ==================================================================================================
# 2. the container's environment
# ==================================================================================================
# Applied on the first start of a volume, or on any start with REINSTALL=1.  The commented values are
# what this install resolved to; they are recorded in /data/config/strata-<tag>.json.

FAMILY=unsloth                  # qwen | unsloth | ... the model family
MODEL=UD-Q4_K_XL                # the quantisation variant within the family
GPUS=0,1                        # the cards the engine uses: one model across both V100s
API_KEY_FILE=$HOME/.strata-api-key   # read by the start script and reconciled into the install config's
                                     # "api_key" on every start, so changing this file is enough; the
                                     # value is never an argument or an env var, except on the first
                                     # start of a new volume (setup.py has no config yet; it is then
                                     # API_KEY on that one start).  serve/server.py
                                     # enforces it on every route but /health.
                                     #
                                     # Put a random value in this file (e.g. head -c 24 /dev/urandom |
                                     # base64): it is a plain bearer token, so treat it as a secret.

# CONTEXT=32768                 # -> setup.py's default; currently 32768
# KV=int8                       # -> setup.py's default; currently int8 (codes + an fp16 scale per 64)
# RESIDENT_BUDGET_GIB=71        # -> setup.py's pick; currently 71 -> 28.21 GiB of experts pinned in RAM
# KV_STREAMING=auto             # -> setup.py's default; moot at a 32K context (it starts at 64K)
# VISION=no                     # -> the image's default; currently no (no image encoder in the image)
# HOST=0.0.0.0                  # -> the image's default; currently 0.0.0.0
# PORT=8080                     # -> the image's default; currently 8080 (the container's own port)
# LOW_RAM=auto                  # -> setup.py's default; auto measures host RAM, not a cgroup limit
LAYER_SPLIT=25                  # pinned: auto ties K=23 and K=25 on its decode-cost model and picks by live free VRAM,
                                # so restarts flip between them; K=25 reads prompts 6-11% faster (GPU1 also
                                # carries the head and the draft layer), decode is unchanged
# GPU=                          # one card instead of GPUS
# GGUF_DIR=                     # a mounted folder of GGUFs you already have: no download
# REINSTALL=1                   # re-run setup with the values above (a full setup pass)
# CONFIG=                       # start with this config file instead of the install one
# STRATA_DATA=/data             # -> the image's default
# STRATA_CPUINFO=/proc/cpuinfo  # -> the image's default; the source of the no-AVX2 warning (a test hook)

# ==================================================================================================
# 3. engine flags
# ==================================================================================================
# ENGINE_ARGS is reconciled into the install config's "args" by strata-start.sh on every start: a flag
# named here replaces any earlier one of the same name, and clearing it here removes it again.  Empty
# means "change nothing".  Flags and their values, space separated, e.g.:
#
#     ENGINE_ARGS="--batch 4 --prompt-cache 8"
#
# --batch is the one that changes the load behaviour: unset, the server runs one request at a time
# behind a FIFO (serve/server.py) and extra clients only queue - measured flat at ~58 tok/s from 1 to
# 8 clients, with the GPUs ~50% idle.  docs/BATCHING.md; each slot takes VRAM from the expert cache.

ENGINE_ARGS="--batch 2 --max-context 262144 --pool-workers 22 --aux-cpus auto --prefill auto"

# -- the flags the install config already sets (setup.py writes them; shown for reference) ----------
# --pack                               /data/packs/unsloth-ud-q4_k_xl
# --native                             <shard-1 gguf>
# --kv                                 int8
# --max-context                        32768 (setup.py) -> 262144, overridden by ENGINE_ARGS above
# --serve                              added by server.py
# --mtp                                /data/mtp/rt
# --spec                               4
# --spec-min-p                         0.5
# --prefill                            auto
# --expert-profile                     /opt/strata/data/expert-profile.bin
# --expert-cache                       auto

